name: Update rocket heatmap

on:
  schedule:
    - cron: "30 5 * * *"   # every day at 05:30 UTC
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw the heatmap
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERM_USER: mario
          OUTPUT_PATH: jet-heatmap.svg
        run: python3 jet_heatmap.py

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jet-heatmap.svg
          git diff --cached --quiet || git commit -m "Update rocket heatmap"
          git push
